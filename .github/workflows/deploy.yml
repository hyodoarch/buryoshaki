name: Deploy Quartz site to GitHub Pages
 
on:
  push:
    branches:
      - v5
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}

      - name: Install Dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: |
          rm -rf .quartz/plugins/article-title
          rm -rf .quartz/plugins/folder-page
          rm -rf .quartz/plugins/tag-page
          rm -rf .quartz/plugins/recent-notes
          rm -rf .quartz/plugins/canvas-page
          
          npx quartz plugin install --clean article-title
          npx quartz plugin install --clean folder-page
          npx quartz plugin install --clean tag-page
          npx quartz plugin install --clean recent-notes
          npx quartz plugin install --clean canvas-page
          
          npx quartz plugin install

      - name: Patch Explorer scroll position
        shell: bash
        run: |
          FILE=".quartz/plugins/explorer/src/components/scripts/explorer.inline.ts"

          if [ ! -f "$FILE" ]; then
            echo "::error::Explorer source file not found: $FILE"
            exit 1
          fi

          OLD_SAVE='const explorer = document.querySelector(".explorer-ul");'
          NEW_SAVE='const explorer = document.querySelector(".sidebar.left");'
          OLD_RESTORE='explorerUl.scrollTop = parseInt(scrollTop, 10);'
          NEW_RESTORE='document.querySelector(".sidebar.left").scrollTop = parseInt(scrollTop, 10);'

          if grep -Fq "$NEW_SAVE" "$FILE" &&
             grep -Fq "$NEW_RESTORE" "$FILE"; then
            echo "Explorer scroll patch already applied."
          elif grep -Fq "$OLD_SAVE" "$FILE" &&
               grep -Fq "$OLD_RESTORE" "$FILE"; then
            sed -i 's/const explorer = document\.querySelector("\.explorer-ul");/const explorer = document.querySelector(".sidebar.left");/' "$FILE"
            sed -i 's/explorerUl\.scrollTop = parseInt(scrollTop, 10);/document.querySelector(".sidebar.left").scrollTop = parseInt(scrollTop, 10);/' "$FILE"
            echo "Explorer scroll patch applied."
          else
            echo "::error::Unexpected Explorer source; patch needs review."
            grep -nE 'const explorer =|scrollTop' "$FILE" || true
            exit 1
          fi

          grep -F "$NEW_SAVE" "$FILE"
          grep -F "$NEW_RESTORE" "$FILE"

          cd .quartz/plugins/explorer
          npm install
          npm run build

      - name: Build Quartz
        run: npx quartz build
 
      - name: Copy Search Console verification file
        run: cp content/googled614ff6354d873ef.html public/googled614ff6354d873ef.html 

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
